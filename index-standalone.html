<!doctype html>
<html>
<head>
    <meta charset="utf-8">
    <title>RPG Adventure - Mobile RPG Game</title>
    <meta name="viewport" content="initial-scale=1, maximum-scale=1, user-scalable=no, minimum-scale=1, width=device-width, height=device-height, viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="theme-color" content="#000000">
    <style>
        body, html {
            height: 100%;
            width: 100%;
            overflow: hidden;
            margin: 0;
            padding: 0;
            position: fixed;
            overscroll-behavior: none;
            -webkit-overflow-scrolling: touch;
        }
        body {
            background-color: black;
            display: flex;
            align-items: center;
            justify-content: center;
            touch-action: none;
            -webkit-touch-callout: none;
            -webkit-user-select: none;
            user-select: none;
        }
        #rpg {
            position: relative;
            touch-action: manipulation;
            width: 100vw;
            height: 100vh;
        }
        @supports (padding: max(0px)) {
            body {
                padding-left: env(safe-area-inset-left);
                padding-right: env(safe-area-inset-right);
                padding-top: env(safe-area-inset-top);
                padding-bottom: env(safe-area-inset-bottom);
            }
        }
    </style>
</head>
<body>
    <div id="rpg"></div>
    <script type="module">
        import { RpgStandalone } from '@rpgjs/standalone'
        import modules from './main/index.ts'

        const rpg = new RpgStandalone()
        rpg
            .addModules([modules])
            .start(document.getElementById('rpg'))
    </script>
</body>
</html>
