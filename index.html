<!doctype html>
<html>

<head>
    <meta charset="utf-8">
    <title>RPG Adventure - Mobile RPG Game</title>
    <meta name="viewport" content="initial-scale=1, maximum-scale=1, user-scalable=no, minimum-scale=1, width=device-width, height=device-height, viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="theme-color" content="#000000">
</head>

<body>
    <div id="rpg"></div>
    
    <style>
        body,
        html {
            height: 100%;
            width: 100%;
            overflow: hidden;
            margin: 0;
            padding: 0;
            position: fixed;
            /* Prevent pull-to-refresh and overscroll */
            overscroll-behavior: none;
            -webkit-overflow-scrolling: touch;
        }

        body {
            background-color: black;
            display: flex;
            align-items: center;
            justify-content: center;
            /* Better touch handling */
            touch-action: none;
            -webkit-touch-callout: none;
            -webkit-user-select: none;
            user-select: none;
        }

        #rpg {
            position: relative;
            touch-action: manipulation;
        }

        /* Desktop/Tablet landscape */
        @media (min-width: 800px) {
            #rpg {
                width: 816px;
                height: 624px;
            }
        }

        /* Mobile - Full screen */
        @media (max-width: 800px) {
            #rpg {
                position: absolute;
                top: 0;
                left: 0;
                right: 0;
                bottom: 0;
                width: 100vw;
                height: 100vh;
            }
        }

        /* Mobile Portrait - Optimize for portrait orientation */
        @media (max-width: 800px) and (orientation: portrait) {
            #rpg {
                /* Ensure canvas scales properly in portrait */
                max-width: 100vw;
                max-height: 100vh;
            }
        }

        /* iPhone notch support */
        @supports (padding: max(0px)) {
            body {
                padding-left: env(safe-area-inset-left);
                padding-right: env(safe-area-inset-right);
                padding-top: env(safe-area-inset-top);
                padding-bottom: env(safe-area-inset-bottom);
            }
        }
    </style>
</body>

</html>
